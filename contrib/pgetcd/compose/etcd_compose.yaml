networks:
  etcd_bridge:
    driver: bridge
    name: etcd_bridge
services:
  # --- The Application ---
  etcd:
    image: quay.io/coreos/etcd:v3.6.7
    container_name: etcd
    environment:
      ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:23790"
      ETCD_ADVERTISE_CLIENT_URLS: "http://0.0.0.0:23790"
      ETCD_QUOTA_BACKEND_BYTES: 32212254720
      #ETCD_AUTO_COMPACTION_MODE: 'periodic'
      #ETCD_AUTO_COMPACTION_RETENTION: '5m'
    ports:
      - "23790:23790"
      - "2380:2380"
      - "6060:6060"
    networks:
      - etcd_bridge
    healthcheck:
      test: ["CMD", "etcdctl endpoint health --endpoints http://localhost:23790"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s